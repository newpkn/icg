    //Camera + Controls
    function createCameraAndControls(camX, camY, camZ, targetX, targetY, targetZ) {
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(camX, camY, camZ);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enabled = false;
        controls.enablePan = false;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI;
        controls.minPolarAngle = 0;
        controls.target.set(targetX, targetY, targetZ);
        controls.update();
        return { camera, controls, initialPos: camera.position.clone(), initialTarget: controls.target.clone() };
    }

    // === Uniforms ===
const uniformsFlag = {
    uTime: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.3, 1.0, 0.6).normalize() }
};

// === Vertex Shader ===
    const vertFlag = `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec2 vUv;

    void main() {
    float PI = 3.141592653589793;
    vNormal = normalize(normalMatrix * normal);
    vUv = uv;

    vec3 pos = position;

    // โบกผืนธงแบบคลื่นแนวนอน
    float wave = sin((pos.x * 3.0 + uTime * 2.0)) * 0.15;
    pos.z += wave;
    pos.y += sin(pos.x * 2.0 + uTime * 3.0) * 0.05;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}`;

// === Fragment Shader ===
    const fragFlag = `
    precision mediump float;
    varying vec3 vNormal;
    varying vec2 vUv;
    uniform vec3 uLightDir;

    void main() {
    float light = dot(normalize(vNormal), normalize(uLightDir)) * 0.5 + 0.5;

    vec3 color;
    if (vUv.y > 0.66) color = vec3(1.0, 0.0, 0.0); // แดง
    else if (vUv.y > 0.33) color = vec3(1.0); // ขาว
    else color = vec3(0.0, 0.0, 1.0); // น้ำเงิน

    gl_FragColor = vec4(color * light, 1.0);
}`;

// Flag Geometry & Material
    const geoFlag = new THREE.PlaneBufferGeometry(1.6, 1.0, 100, 50);
    const matFlag = new THREE.ShaderMaterial({
    vertexShader: vertFlag,
    fragmentShader: fragFlag,
    uniforms: uniformsFlag,
    side: THREE.DoubleSide
    });

    const flag = new THREE.Mesh(geoFlag, matFlag);
    flag.scale.set(2, 2, 2);
    flag.position.set(8.4, 1.6, -6);

// Vertex Shader cell
    const vertcell = `
    varying vec3 vNormal;
    varying vec3 vPosW;
    varying vec2 vUv;

    void main(){
        vNormal = normalize(mat3(modelMatrix) * normal);
        vPosW = (modelMatrix * vec4(position, 1.0)).xyz;
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

    varying vec3 vNormal;
    varying vec3 vPosW;
    varying vec2 vUv;

    uniform vec3 uLightDir;
    uniform sampler2D uTex;

    void main() {
        vec3 texColor = texture2D(uTex, vUv).rgb; // อ่านสีจาก texture

        float diffuse = max(dot(vNormal, uLightDir), 0.0);
        vec3 R = reflect(-uLightDir, vNormal);
        vec3 V = normalize(cameraPosition - vPosW);
        float specular = max(pow(dot(R,V), 8.0), 0.0);

        if(diffuse <= 0.1) specular = 0.0;

        vec3 color = (texColor * diffuse) + vec3(specular);
        gl_FragColor = vec4(color, 1.0);
    }`;

    // ฟังก์ชันสร้าง ShaderMaterial พร้อม texture
    function createTexturedShaderMaterial(texture) {
        const mat = new THREE.ShaderMaterial({
        vertexShader: vertcell,
        fragmentShader: fragcell,
        uniforms: {
            uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
            uTex: { value: texture }
        }
        });
        mat.side = THREE.DoubleSide;
        return mat;
    }

    // โหลดโมเดลพร้อม texture
    const loader6 = new THREE.GLTFLoader();
    const loader7 = new THREE.GLTFLoader();
    // load SKS
    loader6.load("https://raw.githubusercontent.com/newpkn/icg/main/sks.glb", (gltf) => {
        const SKS = gltf.scene;
        SKS.scale.set(3.5, 3.5, 3.5);
        SKS.position.set(8.4, 1.2, 6.5);
        //SKS.rotation.x = -90 * Math.PI / 180;
        SKS.rotation.z = 90 * Math.PI / 180;
        SKS.traverse(obj => {
        if (obj.isMesh) {
            const texture = obj.material.map; // ดึง texture เดิมจาก glb
            if (texture) {
            obj.material = createTexturedShaderMaterial(texture); // ใช้ shader ที่ผสม texture
            }
            obj.castShadow = obj.receiveShadow = true;
        }
        });
        scene.add(SKS);
    });

    // Load Kar98K
    loader7.load("https://raw.githubusercontent.com/newpkn/icg/main/kar98k.glb", (gltf) => {
        const Kar98K = gltf.scene;
        Kar98K.scale.set(0.8, 0.8, 0.8);
        Kar98K.position.set(8.4, 2, 3);
        Kar98K.rotation.z = 90 * Math.PI / 180;
        Kar98K.rotation.x = -90 * Math.PI / 180;
        Kar98K.traverse(obj => {
        if (obj.isMesh) {
            const texture = obj.material.map;
            if (texture) {
            obj.material = createTexturedShaderMaterial(texture);
            }
            obj.castShadow = obj.receiveShadow = true;
        }
        });
        scene.add(Kar98K);
    });

//// PBR Shader
    //Load First Aid
    const Loader8 = new THREE.GLTFLoader();

    //load painkiller
    const Loader9 = new THREE.GLTFLoader();

    //load grenade
    const Loader10 = new THREE.GLTFLoader();
    Loader10.load("https://raw.githubusercontent.com/newpkn/icg/main/PUBGgrenade.glb", (gltf) => {
    const grenade = gltf.scene;
    grenade.scale.set(0.05, 0.05, 0.05);

    //load smokegrenade
    const Loader11 = new THREE.GLTFLoader();
    Loader11.load("https://raw.githubusercontent.com/newpkn/icg/main/PUBGsmoke_grenade.glb", (gltf) => {
    const smokegrenade = gltf.scene;
    smokegrenade.scale.set(0.04, 0.04, 0.04);
    smokegrenade.position.set(-3.1, 1.73, 8.5);
    smokegrenade.traverse(obj => {
        if (obj.isMesh) {

        obj.receiveShadow = true;
        }
    });
    scene.add(smokegrenade);
    });

    // Raycaster & Mouse สำหรับตรวจจับการคลิก
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let cameraMoveTarget = null;

    // moveCamera
    function moveCameraTo(targetCameraObj, duration = 0.02) {
        cameraMoveTarget = { camobj: targetCameraObj, speed: duration };

        isLocked = true;
        activeControls.enabled = false;

        for (const key in keys) keys[key] = false;
    }

    function onObjectClick(objectName, callback) {
        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, activeCamera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for(let i=0;i<intersects.length;i++){
                let obj = intersects[i].object;
                while(obj){
                    if(obj.name === objectName){
                        callback(obj);
                        return;
                    }
                    obj = obj.parent;
                }
            }
        });
    }

    // WASD Movement
    const keys = { w: false, a: false, s: false, d: false, ' ': false, shift: false };
    window.addEventListener('keydown', (e) => {
        if (e.key === ' ') keys[' '] = true;
        else if (e.key === 'shift') keys.shift = true;
        else if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === ' ') keys[' '] = false;
        else if (e.key === 'shift') keys.shift = false;
        else if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
    });

    // กด ESC เพื่อสลับโหมด
    window.addEventListener('keydown', (event) => {
        if (event.key === "Escape") {
            if (isLocked) {
                isLocked = false;
                activeControls.enabled = true;
            } else {
                activeControls.enabled = false;
                cameraMoveTarget = { camobj: cam1, speed: 0.02 };
            }
        }
    });

    const clock = new THREE.Clock();
    function animate() {
        uniformsFlag.uTime.value = performance.now() / 1000;
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const speed = 3 * delta;

        const pos = camera.position;
        positionLabel.innerHTML = `
            <b>Camera Position</b><br>
            x: ${pos.x.toFixed(2)}<br>
            y: ${pos.y.toFixed(2)}<br>
            z: ${pos.z.toFixed(2)}
        `;

        // เดินเมื่อปลดล็อก
        if (!isLocked && !returning) {
            const dir = new THREE.Vector3();
            activeCamera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

            if (keys.w) activeCamera.position.add(dir.clone().multiplyScalar(speed));
            if (keys.s) activeCamera.position.add(dir.clone().multiplyScalar(-speed));
            if (keys.a) activeCamera.position.add(right.clone().multiplyScalar(-speed));
            if (keys.d) activeCamera.position.add(right.clone().multiplyScalar(speed));
            if (keys[' ']) activeCamera.position.y += speed;
            if (keys.shift) activeCamera.position.y -= speed;

            const front = new THREE.Vector3(0, 0, -1).applyQuaternion(activeCamera.quaternion);
            activeControls.target.copy(activeCamera.position.clone().add(front));
            activeControls.update();
        }

        // กลับตำแหน่งเดิมแบบนุ่มนวล
        if (returning) {
            activeCamera.position.lerp(currentInitialPos, 0.03);
            activeControls.target.lerp(currentInitialTarget, 0.03);
            activeControls.update();

            if (activeCamera.position.distanceTo(currentInitialPos) < 0.05 && activeControls.target.distanceTo(currentInitialTarget) < 0.05) {
                activeCamera.position.copy(currentInitialPos);
                activeControls.target.copy(currentInitialTarget);
                activeControls.update();
                returning = false;
                isLocked = true;
                activeControls.enabled = false;
            }
        }

        if (cameraMoveTarget) {
            const { camobj, speed } = cameraMoveTarget;

            activeCamera.position.lerp(camobj.camera.position, speed);
            activeControls.target.lerp(camobj.controls.target, speed);
            activeControls.update();

            if (activeCamera.position.distanceTo(camobj.camera.position) < 0.05 && activeControls.target.distanceTo(camobj.controls.target) < 0.05 ) {
                activeCamera.position.copy(camobj.camera.position);
                activeControls.target.copy(camobj.controls.target);
                activeControls.update();
                cameraMoveTarget = null;
                returning = false;
                isLocked = true;
                activeControls.enabled = false;
            }
        }
        activeControls.update();
        renderer.render(scene, activeCamera);
    }
    animate();

    // ===== สร้างกล่องแสดงตำแหน่ง =====
    const positionLabel = document.createElement('div');
    positionLabel.style.position = 'absolute';
    positionLabel.style.top = '10px';
    positionLabel.style.left = '10px';
    positionLabel.style.padding = '8px 12px';
    positionLabel.style.background = 'rgba(0,0,0,0.6)';
    positionLabel.style.color = '#00ffcc';
    positionLabel.style.fontFamily = 'monospace';
    positionLabel.style.borderRadius = '8px';
    positionLabel.style.fontSize = '14px';
    positionLabel.style.zIndex = '100';
    document.body.appendChild(positionLabel);


    //GUI
    const gui = new dat.GUI();
    gui.width = 350;
    const lightFolder = gui.addFolder('Directional Light');
    lightFolder.add(dirLight.position,'x',-20,20);
    lightFolder.add(dirLight.position,'y',-20,20);
    lightFolder.add(dirLight.position,'z',-20,20);
    lightFolder.add(dirLight,'intensity',0,5);
    lightFolder.open();
    const cameraFolder = gui.addFolder('คำสั่งกล้อง');
    cameraFolder.add({ message: "เพื่อปลดล็อกกล้อง / ล็อกกล้อง" }, 'message').name("กด ESC");
    cameraFolder.add({ message: "เพื่อเดิน" }, 'message').name("กด W A S D");
    cameraFolder.add({ message: "เพื่อขึ้น กับ ลง" }, 'message').name("กด spacebar / shift");
    cameraFolder.open();

    // ปรับขนาดเมื่อ resize
    window.addEventListener('resize', () => {
        activeCamera.aspect = window.innerWidth / window.innerHeight;
        activeCamera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
