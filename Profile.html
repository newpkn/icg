<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="utf-8" />
<title>Profile 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    html,
    body {
    height: 100%;
    margin: 0
    }

    canvas {
    display: block
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/pmrem/PMREMGenerator.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
</head>

<body>
<script>
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0,5,8);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // HDRI Background
    // const pmremGenerator = new THREE.PMREMGenerator(renderer);
    // pmremGenerator.compileEquirectangularShader();

    // new THREE.RGBELoader().load('photo_studio.hdr', function(hdrTexture){
    //     const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
    //     scene.background = envMap;
    //     scene.environment = envMap;
    //     hdrTexture.dispose();
    //     pmremGenerator.dispose();
    // });

    const Background = new THREE.TextureLoader();
    const backgroundTexture = Background.load('background.jpg');
    scene.background = backgroundTexture;


    // Plane with texture
    const textureLoader = new THREE.TextureLoader();
    const floorTexture = textureLoader.load('brick.jpg');
    const floorMaterial = new THREE.MeshStandardMaterial({map: floorTexture});
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), floorMaterial);
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Lights
    const dirLight = new THREE.DirectionalLight(0xffffff,1);
    dirLight.position.set(5,10,5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ambLight = new THREE.AmbientLight(0xffffff,0.3);
    scene.add(ambLight);

    // Load Porsche Car
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load("https://raw.githubusercontent.com/newpkn/icg/main/porsche.glb", (gltf) => {
    const car = gltf.scene;
    car.scale.set(1.5, 1.5, 1.5);
    car.position.set(0, 0, 0);
    car.traverse(obj => {
        if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
        }
    });
    scene.add(car);
    });


    // GUI
    const gui = new dat.GUI();
    const lightFolder = gui.addFolder('Directional Light');
    lightFolder.add(dirLight.position,'x',-10,10).name('X');
    lightFolder.add(dirLight.position,'y',-10,10).name('Y');
    lightFolder.add(dirLight.position,'z',-10,10).name('Z');
    lightFolder.add(dirLight,'intensity',0,5).name('Intensity');
    lightFolder.open();

    function animate(){
        requestAnimationFrame(animate);
        renderer.render(scene,camera);
    }
    animate();


</script>

</body>
</html>
