<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="utf-8" />
<title>Profile 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    html,
    body {
    height: 100%;
    margin: auto;
    }

    canvas {
    display: block
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/pmrem/PMREMGenerator.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
</head>

<body>
<script>
    // Scene
    const scene = new THREE.Scene();

    // Renderer
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Camera + Controls
    function createCameraAndControls(x, y, z){
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(x, y, z);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enabledPan = false;
        controls.enabledZoom = true;
        controls.maxPolarAngle = 125 * Math.PI / 180;
        controls.minPolarAngle = 0;
        controls.update();
        return {camera, controls};
    }
    const cam1 = createCameraAndControls(0,1,6);
    const cam2 = createCameraAndControls(50,1,6);
    const cam3 = createCameraAndControls(-50,1,6);
    let activeCamera = cam1.camera;
    let activeControls = cam1.controls;
    
    // Background
    const Background = new THREE.TextureLoader();
    const backgroundTexture = Background.load('background.jpg');
    scene.background = backgroundTexture;

    // floor with texture
    function createFloor(x,y,z){
        const texture = new THREE.TextureLoader();
        const floortexture = texture.load('brick.jpg');
        floortexture.wrapS = THREE.RepeatWrapping;
        floortexture.wrapT = THREE.RepeatWrapping;
        floortexture.repeat.set(4,4);
        const material = new THREE.MeshStandardMaterial({map: floortexture})
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), material);
        floor.rotation.x = -Math.PI/2;
        floor.position.set(x,y,z);
        floor.receiveShadow = true;
        scene.add(floor);
        return floor;
    }
    const floor1 = createFloor(0,0,0);
    const floor2 = createFloor(50,0,0);
    const floor3 = createFloor(-50,0,0);

    function createWall(x, y, z, width, height, texturePath) {
        const texture = new THREE.TextureLoader();
        const wallTexture = texture.load(texturePath || 'brick.jpg');
        wallTexture.wrapS = THREE.RepeatWrapping;
        wallTexture.wrapT = THREE.RepeatWrapping;
        wallTexture.repeat.set(2, 2); // ปรับการ repeat ให้เหมาะสม

        const material = new THREE.MeshStandardMaterial({ map: wallTexture });
        const wall = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material);

        // หมุนให้ตั้งฉากกับพื้น (แนว Z)
        wall.rotation.y = 0; // กำแพงหันหน้าไปทาง Z
        wall.position.set(x, y, z);

        wall.receiveShadow = true;
        wall.castShadow = true;
        scene.add(wall);

        return wall;
    }
    //wall for floor1
    const wall1 = createWall(0, 2.5, -5, 10, 5, 'brick.jpg');
    const wall2 = createWall(-5, 2.5, 0, 10, 5, 'brick.jpg');
    wall2.rotation.y = Math.PI / 2;
    const wall3 = createWall(5, 2.5, 0, 10, 5, 'brick.jpg');
    wall3.rotation.y = 270 * Math.PI / 180 ;
    const wall4 = createWall(0, 2.5, 5, 10, 5, 'brick.jpg');
    wall4.rotation.y = Math.PI;

    //wall for floor2
    const wall5 = createWall(50, 2.5, -5, 10, 5, 'brick.jpg');
    const wall6 = createWall(45, 2.5, 0, 10, 5, 'brick.jpg');
    wall6.rotation.y = Math.PI / 2;
    const wall7 = createWall(55, 2.5, 0, 10, 5, 'brick.jpg');
    wall7.rotation.y = 270 * Math.PI / 180 ;
    const wall8 = createWall(50, 2.5, 5, 10, 5, 'brick.jpg');
    wall8.rotation.y = Math.PI;

    //wall for floor3
    const wall9 = createWall(-50, 2.5, -5, 10, 5, 'brick.jpg');
    const wall10 = createWall(-55, 2.5, 0, 10, 5, 'brick.jpg');
    wall10.rotation.y = Math.PI / 2;
    const wall11 = createWall(-45, 2.5, 0, 10, 5, 'brick.jpg');
    wall11.rotation.y = 270 * Math.PI / 180 ;
    const wall12 = createWall(-50, 2.5, 5, 10, 5, 'brick.jpg');
    wall12.rotation.y = Math.PI;

    // Lights
    const dirLight = new THREE.DirectionalLight(0xffffff,1);
    dirLight.position.set(2,7,4);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const ambLight = new THREE.AmbientLight(0xffffff,0.3);
    scene.add(ambLight);

    // Load Text Project
    let Project;
    const gltfLoader1 = new THREE.GLTFLoader();
    gltfLoader1.load("https://raw.githubusercontent.com/newpkn/icg/main/Project.glb", (gltf) => {
        Project = gltf.scene;
        Project.scale.set(1, 1, 1);
        Project.position.set(1, 0, 1);
        Project.traverse(obj => {
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
    });
    scene.add(Project);
    });

    let Profile;
    const gltfLoader2 = new THREE.GLTFLoader();
    gltfLoader1.load("https://raw.githubusercontent.com/newpkn/icg/main/Profile.glb", (gltf) => {
        Profile = gltf.scene;
        Profile.scale.set(1, 1, 1);
        Profile.position.set(-4, 0, 1);
        Profile.traverse(obj => {
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
    });
    scene.add(Profile);
    });

    // Load Text name
    let name;
    const gltfLoader3 = new THREE.GLTFLoader();
    gltfLoader3.load("https://raw.githubusercontent.com/newpkn/icg/main/PF.glb", (gltf) => {
        name = gltf.scene;
        name.scale.set(0.4, 0.4, 0.4);
        name.position.set(-55, 0.3, -2);
        name.traverse(obj => {
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
    });
    scene.add(name);
    });

    let back1
    const gltfLoader4 = new THREE.GLTFLoader();
    gltfLoader4.load("https://raw.githubusercontent.com/newpkn/icg/main/Back.glb", (gltf) => {
        back1 = gltf.scene;
        back1.scale.set(0.5, 0.5, 0.5);
        back1.position.set(-46.5, 0, 2);
        back1.traverse(obj => {
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
    });
    scene.add(back1);
    });

    let back2
    const gltfLoader5 = new THREE.GLTFLoader();
    gltfLoader5.load("https://raw.githubusercontent.com/newpkn/icg/main/Back.glb", (gltf) => {
        back2 = gltf.scene;
        back2.scale.set(0.5, 0.5, 0.5);
        back2.position.set(45, 0, 1);
        back2.traverse(obj => {
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
    });
    scene.add(back2);
    });

    // Raycaster for switching cameras
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function switchCamera(newCam,target){
        activeCamera = newCam.camera;
        activeControls = newCam.controls;

        const cam = target.clone().add(new THREE.Vector3(0,1,6));
        activeCamera.position.copy(cam);

        activeControls.target.copy(target.clone());
        activeControls.update();
    }

    window.addEventListener('click', (event)=>{
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, activeCamera);

        if(Project){
            const intersects = raycaster.intersectObject(Project,true);
            if(intersects.length>0){
                switchCamera(cam2,floor2.position.clone());
            }
        }

        if(Profile){
            const intersects = raycaster.intersectObject(Profile,true);
            if(intersects.length>0){
                switchCamera(cam3,floor3.position.clone());
            }
        }

        if(back1){
            const intersects = raycaster.intersectObject(back1,true);
            if(intersects.length>0){
                switchCamera(cam1,floor1.position.clone());
            }
        }

        if(back2){
            const intersects = raycaster.intersectObject(back2,true);
            if(intersects.length>0){
                switchCamera(cam1,floor1.position.clone());
            }
        }
    });
    
    // WASD movement
    const keys = {w:false,a:false,s:false,d:false};
    window.addEventListener('keydown', e=>{
        keys[e.key]=true;
    });
    window.addEventListener('keyup', e=>{
        keys[e.key]=false;
    });

    const clock = new THREE.Clock();
    function animate(){
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const speed = 3 * delta;

        const  dir = new THREE.Vector3();
        activeCamera.getWorldDirection(dir);
        dir.y = 0;
        dir.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();

        if(keys.w) activeCamera.position.add(dir.clone().multiplyScalar(speed));
        if(keys.s) activeCamera.position.add(dir.clone().multiplyScalar(-speed));
        if(keys.a) activeCamera.position.add(right.clone().multiplyScalar(-speed));
        if(keys.d) activeCamera.position.add(right.clone().multiplyScalar(speed));

        const front = new THREE.Vector3(0,0,-1).applyQuaternion(activeCamera.quaternion);
        activeControls.target.copy(activeCamera.position.clone().add(front));
        activeControls.update();

        renderer.render(scene,activeCamera);
    }
    animate();

    // GUI
    const gui = new dat.GUI();
    const lightFolder = gui.addFolder('Directional Light');
    lightFolder.add(dirLight.position,'x',-10,10);
    lightFolder.add(dirLight.position,'y',-10,10);
    lightFolder.add(dirLight.position,'z',-10,10);
    lightFolder.add(dirLight,'intensity',0,5);
    lightFolder.open();

    window.addEventListener('resize', ()=>{
        activeCamera.aspect = window.innerWidth / window.innerHeight;
        activeCamera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
